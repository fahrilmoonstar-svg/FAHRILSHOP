<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Love Me?</title>
    <style>
        /* Desain halaman */
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .question {
            background: rgba(16, 16, 16, 0.92);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .eyebrow {
            color: #ff8fb1;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            margin: 10px 0 30px 0;
            background: linear-gradient(135deg, #e0e0e0 30%, #a02020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        #yes {
            background: #a02020;
            color: white;
        }
        #yes:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(180, 40, 40, 0.3);
        }

        #no {
            background: #333;
            color: white;
            position: relative;
        }

        .hint {
            color: #aaa;
            font-size: 18px;
            min-height: 24px;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 22px; }
            button { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="question" id="question">
        <p class="eyebrow">just a small question</p>
        <h1>Would you love me?</h1>
        <div class="btn-row" id="btnRow">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
        <p class="hint" id="hint">&nbsp;</p>
    </div>

    <script>
        const btnYes = document.getElementById('yes');
        const btnNo = document.getElementById('no');
        const hint = document.getElementById('hint');

        // Fungsi untuk tombol "No" yang kabur
        btnNo.addEventListener('mouseenter', () => {
            const randomX = Math.floor(Math.random() * 200) - 100;
            const randomY = Math.floor(Math.random() * 200) - 100;
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
            hint.innerHTML = "😏 Kenapa kabur?";
        });

        // Fungsi untuk tombol "Yes"
        btnYes.addEventListener('click', () => {
            hint.innerHTML = "❤️ Aku juga sayang Juragan! ❤️";
            btnYes.style.transform = "scale(1.2)";
            btnNo.style.display = "none";
        });

        // Reset posisi tombol No saat keluar area
        btnNo.addEventListener('mouseleave', () => {
            setTimeout(() => {
                btnNo.style.transform = "translate(0px, 0px)";
            }, 500);
        });
    </script>
</body>
</html>

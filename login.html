<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - FAHRIL PROJECT</title>
    
    <!-- Font yang sama dengan index.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Gaya yang sama persis dengan theme index.html */
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        .login-card {
            background: rgba(16, 16, 16, 0.95);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            text-align: center;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(180, 40, 40, 0.03) 25%, transparent 50%, rgba(180, 40, 40, 0.03) 75%, transparent 100%);
            animation: spinGlow 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card > * { position: relative; z-index: 1; }

        .logo { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 24px; letter-spacing: 4px; background: linear-gradient(135deg, #e0e0e0 30%, #a02020 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .sub-logo { font-size: 13px; letter-spacing: 4px; color: #888; margin-bottom: 30px; display: block; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #aaa; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(180, 40, 40, 0.2);
            border-radius: 8px; color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif; font-size: 16px;
            box-sizing: border-box; transition: 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #a02020; }

        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #a02020; color: white; font-weight: 700; font-size: 18px;
            cursor: pointer; transition: 0.3s; font-family: inherit;
            margin-top: 10px;
        }
        .btn-login:hover { background: #c03030; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(180, 40, 40, 0.2); }

        .error-msg {
            color: #ff4d4d; font-weight: 600; display: none;
            margin-top: 15px; background: rgba(255, 77, 77, 0.1);
            padding: 10px; border-radius: 8px;
        }

        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-link:hover { color: #a02020; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">FAHRIL PROJECT</div>
        <span class="sub-logo">✦ ADMIN PANEL ✦</span>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">🚀 LOGIN</button>
            <div class="error-msg" id="errorMsg">Username atau Password salah!</div>
        </form>

        <a href="index.html" class="back-link">← Kembali ke Toko</a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // --- GANTI 'admin' dan '12345' dengan password yang Anda mau ---
            if(user === 'admin' && pass === '12345') {
                alert('✅ Login Berhasil! Selamat datang Admin.');
                // Jika login berhasil, Anda bisa arahkan ke dashboard admin
                // window.location.href = 'dashboard.html'; 
            } else {
                errorMsg.style.display = 'block';
                // Efek getaran kecil (opsional)
                document.querySelector('.login-card').style.animation = 'shake 0.3s';
                setTimeout(() => {
                    document.querySelector('.login-card').style.animation = '';
                }, 300);
            }
        }

        // Animasi getaran CSS (opsional)
        const styleShake = document.createElement('style');
        styleShake.innerHTML = `
            @keyframes shake {
                0% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                50% { transform: translateX(10px); }
                75% { transform: translateX(-10px); }
                100% { transform: translateX(0); }
            }
        `;
        document.head.appendChild(styleShake);
    </script>

</body>
</html>

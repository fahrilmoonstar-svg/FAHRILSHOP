<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Interaktif - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Desain gelap ala FAHRIL PROJECT */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        .login-box {
            background: rgba(16, 16, 16, 0.95);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #e0e0e0 30%, #a02020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        /* ===== FORM CONTROL DARI GAMBAR ===== */
        .form-control {
            position: relative;
            margin: 20px 0 40px;
            width: 300px;
            margin: 0 auto 40px;
        }

        .form-control input {
            background-color: transparent;
            border: 0;
            border-bottom: 2px #fff solid;
            display: block;
            width: 100%;
            padding: 15px 0;
            font-size: 18px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        .form-control input:focus {
            border-bottom-color: #a02020;
        }

        .form-control label {
            position: absolute;
            top: 15px;
            left: 0;
            pointer-events: none;
        }

        /* Setiap span (huruf) akan dianimasi */
        .form-control label span {
            display: inline-block;
            font-size: 18px;
            min-width: 5px;
            transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: #aaa;
        }

        /* Saat input terisi atau di-fokuskan, huruf naik ke atas */
        .form-control input:focus + label span,
        .form-control input:valid + label span {
            color: #a02020;
            transform: translateY(-30px);
        }

        /* Tombol Login */
        button {
            width: 100%;
            padding: 14px;
            background: #a02020;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        button:hover {
            background: #c03030;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 40, 40, 0.3);
        }

        #hasil {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
        }
        .success { color: #4ade80; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-text">FAHRIL PROJECT</div>

        <!-- ===== FORM CONTROL DENGAN ANIMASI HURUF ===== -->
        <div class="form-control">
            <input type="text" id="passwordInput" required>
            <label>
                <span style="transition-delay: 0ms;">P</span>
                <span style="transition-delay: 50ms;">a</span>
                <span style="transition-delay: 100ms;">s</span>
                <span style="transition-delay: 150ms;">s</span>
                <span style="transition-delay: 200ms;">w</span>
                <span style="transition-delay: 250ms;">o</span>
                <span style="transition-delay: 300ms;">r</span>
                <span style="transition-delay: 350ms;">d</span>
            </label>
        </div>

        <button onclick="cek()">LOGIN</button>

        <p id="hasil"></p>
    </div>

    <script>
        const PASSWORD_BENAR = "admin123";

        function cek(){
            let pw = document.getElementById("passwordInput").value;
            let hasil = document.getElementById("hasil");

            hasil.className = "";

            if(pw === PASSWORD_BENAR){
                alert("✅ Login berhasil!");
                hasil.innerText = "✅ LOGIN BERHASIL";
                hasil.classList.add("success");
            } else {
                hasil.innerText = "❌ PASSWORD SALAH";
                hasil.classList.add("error");
            }

            document.getElementById("passwordInput").value = "";
        }

        document.getElementById("passwordInput").addEventListener("keydown", function(e){
            if(e.key === "Enter"){
                cek();
            }
        });
    </script>

</body>
</html>

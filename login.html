<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Premium - FAHRIL PROJECT</title>
    <style>
        /* ===== CSS DARI GAMBAR ===== */
        body {
            font-family: 'Arial', Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e0b3b, #2b1055);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-form {
            background: #ffffff;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid #eeeef7;
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            color: #1b1335;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        .status-msg {
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }
        .status-msg.success { color: #10b981; }
        .status-msg.error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="login-form">
        <h2 class="form-title">🔐 Masuk</h2>
        <p class="form-subtitle">Silakan masukkan password untuk melanjutkan.</p>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="passInput" placeholder="Masukkan password...">
        </div>

        <button class="submit-btn" onclick="cekLogin()">LOGIN</button>

        <div class="status-msg" id="hasil"></div>
    </div>

    <script>
        const PASS_BENAR = "admin123";

        function cekLogin() {
            let pw = document.getElementById("passInput").value;
            let msg = document.getElementById("hasil");

            if (pw === PASS_BENAR) {
                msg.className = "status-msg success";
                msg.innerText = "✅ Login berhasil! Selamat datang, Juragan!";
            } else {
                msg.className = "status-msg error";
                msg.innerText = "❌ Password salah. Coba lagi.";
            }

            document.getElementById("passInput").value = "";
        }

        // Enter key
        document.getElementById("passInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") cekLogin();
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Desain gelap ala FAHRIL PROJECT */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        .login-box {
            background: rgba(16, 16, 16, 0.95);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #e0e0e0 30%, #a02020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 18px;
            font-weight: 400;
            color: #888;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(180, 40, 40, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #a02020;
            box-shadow: 0 0 15px rgba(180, 40, 40, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #a02020;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        button:hover {
            background: #c03030;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 40, 40, 0.3);
        }

        #hasil {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
        }

        .success { color: #4ade80; }
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-text">FAHRIL PROJECT</div>
        
        <h2>🔒 Admin Login</h2>
        
        <input type="password" id="pass" placeholder="Masukkan password...">
        <button onclick="cek()">LOGIN</button>
        
        <p id="hasil"></p>
    </div>

    <script>
        // Password yang benar (bisa diganti sesuai keinginan)
        const PASSWORD_BENAR = "admin123";

        function cek(){
            let pw = document.getElementById("pass").value;
            let hasil = document.getElementById("hasil");

            // Reset status
            hasil.className = "";

            if(pw === PASSWORD_BENAR){
                alert("✅ Login berhasil!");
                hasil.innerText = "✅ LOGIN BERHASIL";
                hasil.classList.add("success");
            } else {
                hasil.innerText = "❌ PASSWORD SALAH";
                hasil.classList.add("error");
            }

            // Kosongkan input setelah dicek
            document.getElementById("pass").value = "";
        }

        // Biar bisa tekan Enter juga
        document.getElementById("pass").addEventListener("keydown", function(e){
            if(e.key === "Enter"){
                cek();
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass UI - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Desain dark mode ala FAHRIL PROJECT */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
            overflow: hidden;
        }

        /* ===== EFEK GLOW / CAHAYA ===== */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(180, 40, 40, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            top: 20%;
            left: 20%;
            z-index: 1;
            animation: floatGlow 6s ease-in-out infinite;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(30px, -30px) scale(1.2); opacity: 0.8; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        }

        /* ===== GLASS CARD ===== */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 350px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.4s ease;
            cursor: default;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(180, 40, 40, 0.4);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(180, 40, 40, 0.1);
        }

        .card h2 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e0e0e0 30%, #a02020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card p {
            font-size: 18px;
            color: #aaa;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- ===== GLOW EFFECT BACKGROUND ===== -->
    <div class="glow"></div>

    <!-- ===== GLASS UI CARD ===== -->
    <div class="card">
        <h2>Glass UI</h2>
        <p>Hover me</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & GLOBAL ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: #fff;
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* ===== CSS DARI GAMBAR ===== */
        .profile-card h2 {
            color: #764ba2;
            margin-bottom: 5px;
        }
        .profile-card .username {
            color: #888;
            margin-bottom: 15px;
        }
        .profile-info {
            text-align: left;
            margin-top: 20px;
        }
        .profile-info p {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .badge {
            background: #667eea;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .about {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .btn {
            background: #fff;
            color: #764ba2;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        footer {
            margin-top: 40px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== PROFILE CARD ===== -->
        <div class="profile-card">
            <h2>Juragan FAHRIL</h2>
            <div class="username">@fahrilmoonstar</div>
            <div class="badge">⭐ Verified</div>
            
            <div class="profile-info">
                <p><span>📍 Lokasi</span> <span>Tangerang</span></p>
                <p><span>💼 Pekerjaan</span> <span>Developer & IoT</span></p>
                <p><span>🚀 Project</span> <span>4 Aktif</span></p>
            </div>
        </div>

        <!-- ===== ABOUT SECTION ===== -->
        <div class="about">
            <h3>Tentang Saya</h3>
            <p style="font-size: 14px; color: #555; margin-top: 10px;">
                Seorang developer yang suka ngoding, deploy, dan ngobrol random.
            </p>
        </div>

        <!-- ===== BUTTON ===== -->
        <button class="btn">Edit Profil</button>
        <button class="btn">Lihat Portfolio</button>

        <!-- ===== FOOTER ===== -->
        <footer>
            &copy; 2026 FAHRIL PROJECT
        </footer>

    </div>

</body>
</html>

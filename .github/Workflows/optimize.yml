on:
  pull_request:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:test
          load: true

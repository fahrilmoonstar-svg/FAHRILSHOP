<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Style - FAHRIL PROJECT</title>
    <style>
        /* ===== CSS DARI GAMBAR ===== */
        h1 {
            color: blue;
            font-size: 40px;
        }

        p {
            color: gray;
            font-size: 20px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 255, 0.3);
        }
    </style>
</head>
<body>

    <h1>Ini Judul Besar</h1>
    <p>Ini adalah paragraf dengan warna abu-abu dan ukuran 20px.</p>
    <button>Klik Saya</button>

</body>
</html>

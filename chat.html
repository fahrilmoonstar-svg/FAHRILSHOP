<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakaxyz Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== CSS DARI GAMBAR ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #1a0e2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app {
            max-width: 400px;
            width: 100%;
            background: #2a1a3d;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            height: 780px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            background: #2a1a3d;
            padding: 20px 16px;
        }

        /* ===== CSS TAMBAHAN UNTUK UI CHAT ===== */
        .screen.active {
            display: flex;
        }

        /* Header Chat */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .chat-header .info {
            flex: 1;
        }

        .chat-header .info h2 {
            font-size: 18px;
            color: #e0e0e0;
        }

        .chat-header .info p {
            font-size: 13px;
            color: #888;
        }

        /* Area Pesan */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.received {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background: #a855f7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-top: 4px;
            text-align: right;
        }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        .input-area input::placeholder {
            color: #666;
        }

        .input-area button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #a855f7;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-area button:hover {
            background: #7c3aed;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== LAYAR CHAT ===== -->
        <div class="screen active" id="screen-chat">
            <!-- Header -->
            <div class="chat-header">
                <div class="avatar">R</div>
                <div class="info">
                    <h2>Rakaxyz Bot</h2>
                    <p>Online</p>
                </div>
                <i class="fas fa-ellipsis-v" style="color:#888; font-size:18px; cursor:pointer;"></i>
            </div>

            <!-- Pesan -->
            <div class="messages" id="messages-container">
                <div class="message received">
                    Halo! Selamat datang di Rakaxyz Chat. Ada yang bisa saya bantu?
                    <span class="time">10:00</span>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Ketik pesan..." />
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT UNTUK CHAT ===== -->
    <script>
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            const container = document.getElementById('messages-container');

            if (text === '') return;

            // Kirim pesan (tampilan user)
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const myMsg = document.createElement('div');
            myMsg.className = 'message sent';
            myMsg.innerHTML = text + `<span class="time">${timeStr}</span>`;
            container.appendChild(myMsg);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Simulasi balasan bot setelah 1 detik
            setTimeout(() => {
                const botReplies = [
                    "Halo! Terima kasih sudah menghubungi kami.",
                    "Baik, saya akan segera bantu.",
                    "Mohon tunggu sebentar ya.",
                    "Ada yang bisa saya bantu lagi?"
                ];
                const reply = botReplies[Math.floor(Math.random() * botReplies.length)];
                const botTime = new Date();
                const botTimeStr = botTime.getHours().toString().padStart(2, '0') + ':' + botTime.getMinutes().toString().padStart(2, '0');

                const botMsg = document.createElement('div');
                botMsg.className = 'message received';
                botMsg.innerHTML = reply + `<span class="time">${botTimeStr}</span>`;
                container.appendChild(botMsg);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        // Kirim dengan tombol Enter
        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>

        /* ===== HEADER ===== */
        .header {
            display: flex;

            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(180, 40, 40, 0.2);
            margin-bottom: 30px;

        .logo h1 {
            font-family: 'Orbitron', monospace;

            letter-spacing: 4px;

            -webkit-text-fill-color: transparent;

        .logo .sub {

            color: #888;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ===== NAVIGASI (Dari Portofolio) ===== */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;

            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid transparent;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-links a:hover {
            color: #fff;
            border-color: #a02020;
            background: rgba(160, 32, 32, 0.1);

        }

        /* ===== MENU TABS PRODUK ===== */
        .menu-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(180, 40, 40, 0.15);
        }

        .menu-tab {
            padding: 8px 14px;

            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: 0.3s;
            color: #888;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-tab:hover {
            background: rgba(180, 40, 40, 0.1);
            color: #e0e0e0;
        }

        .menu-tab.active {
            background: #a02020;
            color: white;
            border-color: #a02020;
        }

        /* ===== PRODUK GRID ===== */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(180, 40, 40, 0.12);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .product-item:hover {
            transform: scale(1.03);
            border-color: #a02020;
        }

        .product-item.selected {
            border-color: #a02020;
            background: rgba(180, 40, 40, 0.08);
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: #d0d0d0;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #a02020;
            margin-top: 4px;
        }

        /* ===== KERANJANG ===== */
        .cart-section {
            margin-top: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(180, 40, 40, 0.12);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cart-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #d0d0d0;
            letter-spacing: 2px;
        }

        .cart-header h2 span {
            color: #a02020;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #a02020;
        }

        .cart-item-remove {
            background: #a02020;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            transition: 0.3s;
        }

        .cart-item-remove:hover {
            background: #c03030;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            color: #d0d0d0;

        .cart-total span:last-child {
            color: #a02020;
        }

        .empty-cart {
            text-align: center;
            color: #888;
            padding: 30px;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 120px;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;

        .btn-success {
            background: #a02020;
            color: white;
        }

        .btn-success:hover {
            background: #c03030;

        .btn-outline {

            color: #d0d0d0;

                { name: '8 GB 30 hari', price: 53000 }, { name: '12 GB 30 hari', price: 56000 },
                { name: '16 GB 30 hari', price: 62000 }
            ],
            'axis-max': [
                { name: '2 GB + 500 MB 30 hari', price: 17000 }, { name: '3 GB + 500 MB 30 hari', price: 24000 },
                { name: '4 GB + 1 GB 30 hari', price: 31000 }, { name: '5 GB + 1 GB 30 hari', price: 38000 }
            ],
            'smart': [
                { name: '10 GB 7 hari', price: 22000 }, { name: '3 GB 14 hari', price: 22000 },
                { name: '20 GB 3 hari', price: 23000 }
            ],
            'token': [
                { name: '15000', price: 20000 }, { name: '20000', price: 25000 }, { name: '25000', price: 30000 }
            ],
            'pulsa-smartfren': [
                { name: '15 ribu', price: 18000 }, { name: '20 ribu', price: 23000 }, { name: '25 ribu', price: 28000 }
            ],
            'pulsa-xl': [
                { name: '15 ribu', price: 18000 }, { name: '20 ribu', price: 23000 }, { name: '25 ribu', price: 28000 }
            ]
        };

        const menuLabels = {
            'mlbb': 'MLBB', 'ff': 'Free Fire', 'edit': 'Jasa Edit',
            'axis-bronet': 'Axis Bronet', 'axis-warnet': 'Axis Warnet', 'axis-aktif': 'Axis Aktif',
            'axis-pure': 'Axis Pure', 'axis-max': 'Axis Max', 'smart': 'Smart Nonstop',
            'token': 'Token Listrik', 'pulsa-smartfren': 'Pulsa Smartfren', 'pulsa-xl': 'Pulsa XL'
        };

        let cart = [];
        let currentMenu = 'mlbb';
        const WHATSAPP_NUMBER = '62882020654074';

        // ===== RENDER PRODUK =====
        function renderProducts(menu) {
            const container = document.getElementById('menuContents');
            const list = products[menu] || [];
            let html = '<div class="product-grid">';
            list.forEach((p, i) => {
                const sel = cart.some(item => item.name === p.name && item.menu === menu);
                html += `<div class="product-item ${sel ? 'selected' : ''}" onclick="addToCart('${menu}', ${i})">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">Rp ${p.price.toLocaleString()}</div>
                        </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ===== KERANJANG =====
        function addToCart(menu, idx) {
            const p = products[menu][idx];
            const exist = cart.find(item => item.name === p.name && item.menu === menu);
            if (exist) exist.quantity += 1; else cart.push({ ...p, menu, quantity: 1 });
            updateCart();
            renderProducts(currentMenu);
        }

        function removeFromCart(i) {
            cart.splice(i, 1);
            updateCart();
            renderProducts(currentMenu);
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('Yakin ingin mengosongkan keranjang?')) {
                cart = [];
                updateCart();
                renderProducts(currentMenu);
            }
        }

        function updateCart() {
            const items = document.getElementById('cartItems');
            const total = document.getElementById('cartTotal');
            const count = document.getElementById('cartCount');

            if (cart.length === 0) {
                items.innerHTML = '<div class="empty-cart">Keranjang kosong</div>';
                total.textContent = 'Rp 0';
                count.textContent = '0';
                return;
            }

            let t = 0, c = 0, html = '';
            cart.forEach((item, i) => {
                const sub = item.price * item.quantity;
                t += sub; c += item.quantity;
                html += `<div class="cart-item">
                            <div><strong style="color:#d0d0d0;">${item.name}</strong> <span style="color:#888;font-size:13px;">${menuLabels[item.menu]} x${item.quantity}</span></div>
                            <div><span style="font-weight:600;color:#a02020;">Rp ${sub.toLocaleString()}</span> <button class="cart-item-remove" onclick="removeFromCart(${i})">✕</button></div>
                        </div>`;
            });
            items.innerHTML = html;
            total.textContent = `Rp ${t.toLocaleString()}`;
            count.textContent = c;
        }

        // ===== WHATSAPP =====
        function sendWhatsApp() {
            if (cart.length === 0) return;
            let t = 0, msg = 'Pesanan Baru\n\n';
            cart.forEach(i => {
                const sub = i.price * i.quantity; t += sub;
                msg += `${i.name} (${menuLabels[i.menu]}) x${i.quantity} = Rp ${sub.toLocaleString()}\n`;
            });
            msg += `\nTotal: Rp ${t.toLocaleString()}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // ===== EVENT =====
        document.getElementById('menuTabs').addEventListener('click', function(e) {
            if (e.target.classList.contains('menu-tab')) {
                document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentMenu = e.target.dataset.menu;
                renderProducts(currentMenu);
            }
        });

        // ===== INIT =====
        renderProducts('mlbb');
        updateCart();
    </script>

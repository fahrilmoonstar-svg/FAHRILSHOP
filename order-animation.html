<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Truk - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== GLOBAL ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        /* ===== CONTAINER TOMBOL ===== */
        .order-button {
            position: relative;
            background: #a02020;
            color: #fff;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            min-width: 240px;
            height: 60px;
        }

        .order-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(180, 40, 40, 0.3);
        }

        /* ===== TOMBOL SAAT DIKLIK ===== */
        .order-button.is-animating {
            pointer-events: none;
            background: #2a2a3a;
        }

        /* ===== ANIMASI TRUK DARI GAMBAR ===== */
        .order-button .truck {
            position: absolute;
            font-size: 28px;
            top: 50%;
            transform: translateY(-50%);
            left: -40px;
            z-index: 1;
        }

        .order-button.is-animating .truck {
            animation: truck-drive 8s ease forwards;
        }

        .order-button .package {
            position: absolute;
            font-size: 20px;
            top: 30%;
            left: -20px;
            opacity: 0;
            z-index: 2;
        }

        .order-button.is-animating .package {
            animation: load-package 8s ease forwards;
        }

        /* ===== KEYFRAMES ===== */
        @keyframes truck-drive {
            10%, 30% { left: calc(100% - 164px); }
            40% { left: calc(100% - 104px); }
            60% { left: calc(100% - 224px); }
            75%, 100% { left: calc(100% + 24px); }
        }

        @keyframes load-package {
            0% { opacity: 0; left: -20px; }
            30% { opacity: 1; left: calc(100% - 160px); }
            40% { opacity: 0; left: calc(100% - 100px); }
            60% { opacity: 1; left: calc(100% - 220px); }
            75% { opacity: 0; left: calc(100% + 20px); }
            100% { opacity: 0; left: calc(100% + 24px); }
        }

        /* ===== TEKS TOMBOL ===== */
        .order-button .btn-text {
            position: relative;
            z-index: 3;
            transition: opacity 0.3s ease;
        }

        .order-button.is-animating .btn-text {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- ===== TOMBOL ORDER DENGAN ANIMASI ===== -->
    <button class="order-button" id="orderBtn" onclick="startDelivery()">
        <span class="btn-text">🚚 Pesan Sekarang</span>
        <span class="truck">🚛</span>
        <span class="package">📦</span>
    </button>

    <script>
        function startDelivery() {
            const btn = document.getElementById('orderBtn');
            
            // Tambahkan class animasi
            btn.classList.add('is-animating');

            // Reset setelah animasi selesai (8 detik)
            setTimeout(() => {
                btn.classList.remove('is-animating');
                alert("✅ Pesanan sedang diproses!");
            }, 8000);
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoFi Player - FAHRIL PROJECT</title>
    <style>
        /* ===== CSS (Dari style.css) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            color: #eee;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at center, #2a1a3a 0%, #0a0a0a 100%);
            overflow: hidden;
        }

        /* Efek Scanline */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        .wrap {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ff6b8a;
            text-shadow: 0 0 20px rgba(255, 107, 138, 0.3);
            margin-bottom: 30px;
        }

        /* ===== KASET ===== */
        .cas {
            width: 240px;
            height: 160px;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3a);
            border-radius: 12px;
            border: 2px solid #333;
            padding: 15px;
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .lab {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .lab h2 {
            font-size: 14px;
            color: #1a1a2e;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* ===== GULUNGAN PITA (REELS) ===== */
        .reel {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #333;
            background: #e0e0e0;
            position: relative;
            display: inline-block;
            margin: 0 10px;
            transition: transform 0.1s linear;
        }

        .reel .teeth {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-conic-gradient(
                #333 0deg 10deg,
                transparent 10deg 20deg
            );
            opacity: 0.3;
        }

        /* Gulungan berputar saat diputar */
        .is-playing .reel {
            animation: spin 3s linear infinite;
        }
        .is-playing .reel:last-child {
            animation-direction: reverse;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* ===== TOMBOL ===== */
        button {
            background: #a02020;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        button:hover {
            background: #c03030;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(160, 32, 32, 0.3);
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Efek Scanline (CRT Monitor) -->
    <div class="scanlines"></div>

    <div class="wrap">
        <h1>LOFI MUSIC</h1>
        
        <!-- Kaset -->
        <div class="cas" id="tape">
            <div class="lab">
                <h2>MUSIC MIX VOL. 2</h2>
                <div>
                    <div class="reel"><div class="teeth"></div></div>
                    <div class="reel"><div class="teeth"></div></div>
                </div>
            </div>
        </div>

        <!-- Tombol & Status -->
        <button id="btn">▶ Play Tape</button>
        <div class="status" id="status-text">Tape Stopped</div>
    </div>

    <!-- ===== JavaScript (Dari script.js) ===== -->
    <script>
        const btn = document.getElementById('btn');
        const tape = document.getElementById('tape');
        const statusText = document.getElementById('status-text');
        let isPlaying = false;
        let audio = null;

        // Membuat audio secara dinamis untuk menghindari error file
        function createAudio() {
            // Menggunakan audio LoFi dari YouTube via proxy (opsional)
            // Di sini kita akan menggunakan suara sintetis sederhana sebagai gantinya
            audio = new Audio();
            // Sebagai contoh, kita memuat file audio online (bisa diganti dengan URL lokal)
            // Karena kita tidak memiliki file audio, kita akan mensimulasikan pemutaran dengan timer
            return true;
        }

        btn.addEventListener('click', function() {
            if (!isPlaying) {
                // Mulai "memutar"
                isPlaying = true;
                btn.textContent = '⏹ Stop Tape';
                tape.classList.add('is-playing');
                statusText.textContent = '▶ Playing...';
                
                // Simulasi durasi lagu (misal 10 detik)
                setTimeout(() => {
                    if (isPlaying) {
                        stopTape();
                    }
                }, 10000);
                
            } else {
                stopTape();
            }
        });

        function stopTape() {
            isPlaying = false;
            btn.textContent = '▶ Play Tape';
            tape.classList.remove('is-playing');
            statusText.textContent = '⏹ Tape Stopped';
        }
    </script>

</body>
</html>

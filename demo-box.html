<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Box - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 40px;
            flex-wrap: wrap;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            color: #a02020;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }

        /* ===== CSS DARI GAMBAR ===== */
        .card {
            position: relative;
            height: 100%;
            width: 150px;
            text-align: center;
            background-color: rgb(235, 235, 234);
            border-radius: 1rem;
            box-shadow: 0 1px 1px rgb(133, 48, 9);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            scale: 1.03;
            transition: ease-in-out 1s;
        }

        .card h3 {
            color: #1a1a2e;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .card button {
            border: none;
            background-color: brown;
            margin: 1rem;
            padding: 0.5rem;
            border-radius: 2rem;
            color: aliceblue;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .card button:hover {
            background-color: rgb(123, 28, 28);
            cursor: pointer;
        }

        /* ===== DEMO BOX SEBELUMNYA ===== */
        .demo-box {
            background: #1a1e2a;
            padding: 1.2rem 1.3rem;
            border-radius: 1.5rem;
            box-shadow: 10px 20px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 250px;
            width: 100%;
            text-align: center;
        }

        .demo-box h2 {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            color: #e0e0e0;
        }

        .demo-box p {
            color: #aaa;
            font-size: 14px;
        }

        .demo-box .btn-box {
            background: #a02020;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .demo-box .btn-box:hover {
            background: #c03030;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1 class="section-title">📦 UI Components</h1>

    <!-- ===== KARTU DARI GAMBAR ===== -->
    <div class="card">
        <h3>Kartu Coklat</h3>
        <button>Klik</button>
    </div>

    <!-- ===== DEMO BOX SEBELUMNYA ===== -->
    <div class="demo-box">
        <h2>Demo Box</h2>
        <p>Contoh kotak interaktif yang sudah ada sebelumnya.</p>
        <button class="btn-box">Klik Saya</button>
    </div>

</body>
</html>

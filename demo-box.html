<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Box - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 40px;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            color: #a02020;
            text-align: center;
            width: 100%;
        }

        /* ===== BOTTOM NAVIGATION DARI GAMBAR ===== */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper nav {
            position: relative;
            width: 440px;
            padding: 10px 20px;
            background-color: #fff;
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .wrapper nav ul {
            display: flex;
            list-style: none;
            width: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .wrapper nav ul li {
            position: relative;
            z-index: 1;
        }

        .wrapper nav ul li a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 0 10px;
            font-size: 1.5em;
            color: #4070f4;
            text-decoration: none;
            transition: transform 0.5s, text-shadow 0.3s;
            border-radius: 50%;
        }

        .wrapper nav ul li.active > a {
            background-color: #4070f4;
            color: #fff;
            transform: translateY(-40px);
            box-shadow: 0 10px 20px rgba(64, 112, 244, 0.3);
        }

        .wrapper nav ul li.last {
            position: absolute;
            width: 100px;
            height: 80px;
            background-color: #fff;
            border-radius: 0 0 50% 50%;
            top: -40px;
            left: 10px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ===== DEMO BOX SEBELUMNYA ===== */
        .demo-box {
            background: #1a1e2a;
            padding: 1.2rem 1.3rem;
            border-radius: 1.5rem;
            box-shadow: 10px 20px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 250px;
            width: 100%;
            text-align: center;
        }

        .demo-box h2 {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            color: #e0e0e0;
        }

        .demo-box p {
            color: #aaa;
            font-size: 14px;
        }

        .demo-box .btn-box {
            background: #a02020;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .demo-box .btn-box:hover {
            background: #c03030;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1 class="section-title">📦 UI Components</h1>

    <!-- ===== NAVIGASI BAWAH DARI GAMBAR ===== -->
    <div class="wrapper">
        <nav>
            <ul>
                <li class="active"><a href="#"><i class="fas fa-home"></i></a></li>
                <li><a href="#"><i class="fas fa-plus"></i></a></li>
                <li><a href="#"><i class="fas fa-user"></i></a></li>
                <li><a href="#"><i class="fas fa-cog"></i></a></li>
            </ul>
            <li class="last"></li> <!-- Elemen lekukan untuk tombol aktif -->
        </nav>
    </div>

    <!-- ===== DEMO BOX SEBELUMNYA ===== -->
    <div class="demo-box">
        <h2>Demo Box</h2>
        <p>Contoh kotak interaktif yang sudah ada sebelumnya.</p>
        <button class="btn-box">Klik Saya</button>
    </div>

</body>
</html>

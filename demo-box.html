<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Box - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            gap: 30px;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            color: #a02020;
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        /* ===== FLAVOR CARDS (DARI KODE JS) ===== */
        .flavor-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .flavor-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 40, 40, 0.15);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.6s ease;
            transform: translateY(30px);
            opacity: 0;
            transition-delay: 0s;
        }

        /* Class 'visible' akan ditambahkan oleh JavaScript */
        .flavor-card.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .flavor-card i {
            font-size: 48px;
            color: #a02020;
            margin-bottom: 10px;
            display: block;
        }

        .flavor-card h3 {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        .flavor-card p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        /* ===== NAVIGASI BAWAH DARI GAMBAR SEBELUMNYA ===== */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .wrapper nav {
            position: relative;
            width: 440px;
            padding: 10px 20px;
            background-color: #fff;
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .wrapper nav ul {
            display: flex;
            list-style: none;
            width: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .wrapper nav ul li {
            position: relative;
            z-index: 1;
        }

        .wrapper nav ul li a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 0 10px;
            font-size: 1.5em;
            color: #4070f4;
            text-decoration: none;
            transition: transform 0.5s, text-shadow 0.3s;
            border-radius: 50%;
        }

        .wrapper nav ul li.active > a {
            background-color: #4070f4;
            color: #fff;
            transform: translateY(-40px);
            box-shadow: 0 10px 20px rgba(64, 112, 244, 0.3);
        }

        .wrapper nav ul li.last {
            position: absolute;
            width: 100px;
            height: 80px;
            background-color: #fff;
            border-radius: 0 0 50% 50%;
            top: -40px;
            left: 10px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <h1 class="section-title">📦 UI Components</h1>

    <!-- ===== FLAVOR CARDS DENGAN SCROLL REVEAL ===== -->
    <div class="flavor-container" id="flavorContainer">
        <div class="flavor-card">
            <i class="fas fa-fire"></i>
            <h3>Spicy</h3>
            <p>Rasa pedas yang menggigit.</p>
        </div>
        <div class="flavor-card">
            <i class="fas fa-snowflake"></i>
            <h3>Mint</h3>
            <p>Kesegaran daun mint yang menenangkan.</p>
        </div>
        <div class="flavor-card">
            <i class="fas fa-lemon"></i>
            <h3>Citrus</h3>
            <p>Kesegaran jeruk yang cerah.</p>
        </div>
        <div class="flavor-card">
            <i class="fas fa-candy-cane"></i>
            <h3>Sweet</h3>
            <p>Manisnya gula yang lembut.</p>
        </div>
        <div class="flavor-card">
            <i class="fas fa-egg"></i>
            <h3>Savory</h3>
            <p>Rasa gurih yang memanjakan lidah.</p>
        </div>
        <div class="flavor-card">
            <i class="fas fa-mug-hot"></i>
            <h3>Warm</h3>
            <p>Hangatnya kopi di pagi hari.</p>
        </div>
    </div>

    <!-- ===== NAVIGASI BAWAH ===== -->
    <div class="wrapper">
        <nav>
            <ul>
                <li class="active"><a href="#"><i class="fas fa-home"></i></a></li>
                <li><a href="#"><i class="fas fa-plus"></i></a></li>
                <li><a href="#"><i class="fas fa-user"></i></a></li>
                <li><a href="#"><i class="fas fa-cog"></i></a></li>
            </ul>
            <li class="last"></li>
        </nav>
    </div>

    <script>
        // ===== KODE JAVASCRIPT DARI GAMBAR =====
        document.addEventListener("DOMContentLoaded", () => {
            const flavorCards = document.querySelectorAll('.flavor-card');
            
            const cardObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const index = Array.from(flavorCards).indexOf(card);
                        const delay = (index % 3) * 120;

                        setTimeout(() => {
                            card.classList.add("visible");
                        }, delay);

                        cardObserver.unobserve(card);
                    }
                });
            }, { threshold: 0.12 });

            flavorCards.forEach((card) => cardObserver.observe(card));
        });
    </script>

</body>
</html>

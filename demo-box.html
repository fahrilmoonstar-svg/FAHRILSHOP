<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Box - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== CSS DARI GAMBAR ===== */
        .demo-box {
            background: #1a1e2a;
            padding: 1.2rem 1.3rem;
            border-radius: 1.5rem;
            box-shadow: 10px 20px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .demo-box:hover {
            transform: translateY(-5px);
            box-shadow: 15px 25px 25px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .demo-box h2 {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            letter-spacing: 2px;
            color: #e0e0e0;
            margin-top: 0.5rem;
        }

        .demo-box p {
            color: #aaa;
            font-size: 16px;
            text-align: center;
            line-height: 1.6;
        }

        .demo-box .btn-box {
            background: #a02020;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        .demo-box .btn-box:hover {
            background: #c03030;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(180, 40, 40, 0.3);
        }

        .demo-box .icon {
            font-size: 48px;
            margin-bottom: 0.2rem;
        }
    </style>
</head>
<body>

    <!-- ===== DEMO BOX DARI GAMBAR ===== -->
    <div class="demo-box">
        <div class="icon">📦</div>
        <h2>Demo Box</h2>
        <p>Ini adalah contoh kotak interaktif menggunakan CSS flexbox dan shadow elegan. Coba arahkan mouse ke sini.</p>
        <button class="btn-box">Klik Saya</button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Page - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        .weather-card {
            background: rgba(16, 16, 16, 0.92);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .weather-card h2 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #e0e0e0 30%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .weather-card p {
            font-size: 18px;
            margin: 12px 0;
            color: #d0d0d0;
        }

        .weather-card p span {
            color: #fbbf24;
            font-weight: bold;
        }

        .btn-weather {
            margin-top: 25px;
            padding: 12px 30px;
            background: #a02020;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .btn-weather:hover {
            background: #c03030;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 40, 40, 0.2);
        }
    </style>
</head>
<body>

    <div class="weather-card" id="weatherApp">
        <h2>🌤️ Weather</h2>
        <p>📍 Location : <span id="location">Nairobi</span></p>
        <p>🌡️ Temperature : <span id="temperature">25</span>°C</p>
        <p>☁️ Condition : <span id="condition">Partly Cloudy</span></p>

        <button class="btn-weather" onclick="updateWeather()">🔄 Randomize Weather</button>
    </div>

    <script>
        function updateWeather() {
            // Data dummy untuk simulasi cuaca
            const locations = ["Jakarta", "Tangerang", "Bandung", "Yogyakarta", "Bali"];
            const conditions = ["Cerah", "Berawan", "Hujan Ringan", "Hujan Lebat", "Mendung"];
            
            const randomLoc = locations[Math.floor(Math.random() * locations.length)];
            const randomTemp = Math.floor(Math.random() * 15) + 20; // Suhu antara 20-35°C
            const randomCond = conditions[Math.floor(Math.random() * conditions.length)];

            // Update tampilan
            document.getElementById('location').textContent = randomLoc;
            document.getElementById('temperature').textContent = randomTemp;
            document.getElementById('condition').textContent = randomCond;
        }
    </script>

</body>
</html>

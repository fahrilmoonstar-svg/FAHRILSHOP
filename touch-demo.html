<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Touch Interaktif Demo</title>
    <style>
        body {
            background: #03050f;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 80vh;
            border: 2px solid #a02020;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1a2e;
            position: relative;
            box-shadow: 0 0 30px rgba(180, 40, 40, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
        }
        .info span {
            color: #a02020;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            .container { height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="container" id="touchContainer">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div class="info">
        👆 Geser jari di layar untuk <span>mengejar bola</span>!
    </div>

    <script>
        const container = document.getElementById('touchContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let targetMouseX = -1000;
        let ballX = 0;
        let ballY = 0;

        // Inisialisasi ukuran canvas
        function init() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
        }

        // ===== KODE TOUCH DARI GAMBAR =====
        container.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            targetMouseX = e.touches[0].clientX - rect.left;
        }, { passive: true });

        container.addEventListener('touchend', () => { targetMouseX = -1000; });

        // Tambahkan dukungan mouse untuk desktop
        container.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            targetMouseX = e.clientX - rect.left;
        });
        container.addEventListener('mouseleave', () => { targetMouseX = -1000; });

        window.addEventListener('resize', init);

        // Fungsi animasi
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gerakkan bola mengikuti sentuhan
            if (targetMouseX > 0) {
                ballX += (targetMouseX - ballX) * 0.1;
                ballY += (canvas.height / 2 - ballY) * 0.1;
            }

            // Gambar bola
            ctx.beginPath();
            ctx.arc(ballX, ballY, 30, 0, Math.PI * 2);
            ctx.fillStyle = '#a02020';
            ctx.shadowColor = '#a02020';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Gambar mata bola
            ctx.beginPath();
            ctx.arc(ballX - 10, ballY - 5, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ballX + 10, ballY - 5, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Gambar pupil mata
            ctx.beginPath();
            ctx.arc(ballX - 12, ballY - 3, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#03050f';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ballX + 8, ballY - 3, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#03050f';
            ctx.fill();

            requestAnimationFrame(draw);
        }

        init();
        draw();
    </script>
</body>
</html>

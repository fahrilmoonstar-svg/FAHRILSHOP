<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 Belajar HTML - Catatan FAHRIL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 5px solid #a02020;
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #a02020;
        }

        b { color: #a02020; }
        i { color: #007bff; }
        mark { background: #ffeb3b; padding: 2px 6px; border-radius: 4px; }
        sub { color: #28a745; font-weight: bold; }

        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }

        .footer-note a {
            color: #a02020;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📖 Day 2: Belajar HTML</h1>
        <div class="subtitle">Catatan belajar oleh <strong>FAHRIL PROJECT</strong></div>

        <p>
            Air minum biasa mengandung <b>H<sub>2</sub>O</b>.<br>
            Sangat <i>penting</i> untuk diminum <mark>setiap hari</mark>!
        </p>

        <div class="footer-note">
            ✦ Dibuat dengan ❤️ oleh <a href="https://fahrilshop.vercel.app" target="_blank">FAHRIL PROJECT</a>
        </div>
    </div>

</body>
</html>

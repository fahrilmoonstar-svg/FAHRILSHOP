<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - FAHRIL PROJECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03050f;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(180, 40, 40, 0.08) 0%, transparent 60%);
        }

        .card {
            background: rgba(16, 16, 16, 0.92);
            border: 1px solid rgba(180, 40, 40, 0.25);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
        }

        .card h2 {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .card p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ===== FORM DARI GAMBAR ===== */
        .sub-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sub-form input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(180, 40, 40, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .sub-form input:focus {
            border-color: #a02020;
            box-shadow: 0 0 15px rgba(180, 40, 40, 0.1);
        }

        .sub-form input::placeholder {
            color: #888;
        }

        .sub-form button {
            width: 100%;
            padding: 14px;
            background: #a02020;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .sub-form button:hover {
            background: #c03030;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 40, 40, 0.3);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
        }
        .status-msg.success { color: #4ade80; }
        .status-msg.error { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📩 Subscribe</h2>
        <p>Dapatkan update terbaru dari FAHRIL PROJECT langsung ke email Anda.</p>

        <!-- ===== FORM DARI GAMBAR ===== -->
        <form class="sub-form" onsubmit="handleSubmit(event)">
            <input type="email" 
                placeholder="Enter your email" 
                required>
            <button type="submit">Submit</button>
        </form>

        <div class="status-msg" id="msg"></div>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const msg = document.getElementById('msg');
            const input = document.querySelector('input[type="email"]');
            const email = input.value;

            // Simulasi pengiriman data
            msg.className = 'status-msg success';
            msg.textContent = `✅ Terima kasih! Email ${email} telah terdaftar.`;
            
            // Reset input
            input.value = '';
            
            // Hapus pesan setelah 5 detik
            setTimeout(() => {
                msg.textContent = '';
                msg.className = 'status-msg';
            }, 5000);
        }
    </script>

</body>
</html>

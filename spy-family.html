<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waku Waku! - Spy x Family Fan Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0a2e, #2d1b4e);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #ff6ba0;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 0 40px rgba(255, 107, 160, 0.25);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ff6ba0;
            margin-bottom: 5px;
        }

        .sub {
            font-size: 14px;
            color: #a0a0c0;
            letter-spacing: 2px;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #ff6ba0;
            padding: 16px;
            margin: 24px 0;
            border-radius: 8px;
            font-style: italic;
            font-size: 18px;
            color: #e0e0e0;
        }

        .btn-waku {
            background: #ff6ba0;
            color: #1a0a2e;
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            box-shadow: 0 0 30px rgba(255, 107, 160, 0.2);
        }

        .btn-waku:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 107, 160, 0.4);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🥜</div>
        <h1>Anya Forger</h1>
        <div class="sub">✦ Waku Waku! ✦</div>

        <div class="quote-box" id="quoteBox">
            "Kamu jahat!"
        </div>

        <button class="btn-waku" onclick="wakuWaku()">🔊 Waku Waku!</button>

        <div class="footer">Made with ❤️ for Juragan FAHRIL</div>
    </div>

    <script>
        const quotes = [
            "Waku waku!",
            "Kamu jahat!",
            "Aku mau kacang!",
            "Loid, tolong!",
            "Bond!",
            "Yor, jangan marah..."
        ];

        function wakuWaku() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quoteBox').innerText = `"${randomQuote}"`;
            
            // Efek suara sederhana dengan alert
            alert("🔊 Waku Waku! - " + randomQuote);
        }
    </script>

</body>
</html>
